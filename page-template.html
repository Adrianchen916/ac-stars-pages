<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AC · Stars 项目库</title>
<style>
:root{--paper:#f5f3ed;--card:#fffefa;--ink:#222d2b;--muted:#68726e;--line:#dddeda;--green:#236851;--soft:#e9efdf}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}button,input,select{font:inherit}button,select{cursor:pointer}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a5bb70;outline-offset:3px}header{background:#223f34;color:#f5f3ed;padding:40px max(24px,calc((100vw - 1320px)/2));position:relative}header .top{display:flex;justify-content:space-between;align-items:center;gap:16px}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:12px;color:#c0d2c6}h1{font-size:clamp(30px,4vw,46px);letter-spacing:-1px;margin:13px 0 8px;font-weight:650}header p{color:#d1ddd5;max-width:640px;margin:0}header a{color:#e5eadb;text-decoration:none;border:1px solid #6c8477;padding:8px 16px;border-radius:30px;white-space:nowrap}.metrics{display:flex;gap:42px;margin-top:30px}.metric strong{font-size:27px;font-weight:600;display:block}.metric span{font-size:12px;color:#c0d2c6}.shell{max-width:1370px;padding:30px 24px;margin:auto;display:grid;grid-template-columns:220px minmax(0,1fr);gap:32px}aside{align-self:start;position:sticky;top:20px}aside h2{font-size:12px;letter-spacing:1px;color:var(--muted);margin:0 0 14px}nav{display:grid;gap:3px}nav button{display:flex;justify-content:space-between;gap:8px;text-align:left;border:0;background:transparent;border-radius:8px;padding:9px 11px;color:var(--muted);font-size:13px}nav button:hover{background:#e8e8df}nav button[aria-pressed=true]{background:var(--soft);color:var(--green);font-weight:650}nav .n{font-size:12px;opacity:.75}.note{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:17px;margin-top:20px}.toolbar{display:flex;gap:12px;margin-bottom:20px}.search{flex:1;position:relative}.search input{width:100%;padding:12px 38px 12px 15px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink)}#clear{position:absolute;right:7px;top:7px;border:0;background:transparent;color:var(--muted);border-radius:6px;padding:4px 9px}select{max-width:180px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px;color:var(--ink)}.section-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:17px}.section-top h2{margin:0;font-size:20px}.section-top span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0;transition:border-color .15s}.card:hover{border-color:#88a592}.card .category{font-size:11px;color:var(--green);margin-bottom:8px}.card h3{font-size:16px;margin:0;overflow-wrap:anywhere;line-height:1.4}.card h3 a{text-decoration:none}.card h3 a:hover{text-decoration:underline}.owner{font-weight:400;color:var(--muted)}.desc{font-size:13px;color:#57625d;line-height:1.7;margin:12px 0 14px;overflow-wrap:anywhere}.tags{display:flex;flex-wrap:wrap;gap:5px;margin:auto 0 15px}.tag{font-size:10px;background:#efefe8;border-radius:4px;padding:2px 6px;color:#626a61}.tag.new{background:#dceccf;color:#386328}.card footer{display:flex;gap:10px;align-items:center;border-top:1px solid #ecece5;padding-top:11px;font-size:11px;color:var(--muted)}.card footer .updated{margin-left:auto}.empty{padding:70px 20px;text-align:center;color:var(--muted);grid-column:1/-1}.changes{margin-top:36px;border-top:1px solid var(--line);padding-top:20px}.changes h2{font-size:18px;margin:0 0 12px}details{background:var(--card);border:1px solid var(--line);border-radius:8px;margin:8px 0;padding:12px 16px;font-size:13px}summary{cursor:pointer;color:#4f5c54}.change-list{overflow-wrap:anywhere;margin:12px 0 0;line-height:1.9}.bottom{font-size:11px;color:var(--muted);margin:28px 0 0}.file-link{color:var(--green)}@media(min-width:1500px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:800px){header{padding:28px 20px}.shell{display:block;padding:22px 18px}aside{position:static;margin-bottom:20px}nav{display:flex;flex-wrap:wrap;gap:5px}nav button{border:1px solid var(--line);padding:6px 9px;font-size:12px}aside h2,.note{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.metrics{gap:26px}header .top{align-items:flex-start}header a{font-size:12px;padding:6px 12px}}@media(max-width:520px){.grid{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}.search{flex-basis:100%}select{width:100%;max-width:none}.metrics{gap:23px}.metric strong{font-size:23px}.metric:last-child strong{font-size:18px;line-height:38px}.section-top{align-items:center}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="top"><div class="eyebrow">AC / Open source collection</div><a href="https://github.com/Adrianchen916?tab=stars" target="_blank" rel="noopener noreferrer">GitHub Stars ↗</a></div><h1>收集灵感，找到工具。</h1><p>我的公开 Stars 项目库。按用途整理，让收藏更容易找到，也更容易用起来。</p><div class="metrics"><div class="metric"><strong id="total">—</strong><span>已收藏项目</span></div><div class="metric"><strong id="categories">—</strong><span>用途分类</span></div><div class="metric"><strong id="sync-date">—</strong><span>最后同步 · 北京时间</span></div></div></header>
<div class="shell"><aside><h2>浏览分类</h2><nav id="category-nav" aria-label="用途分类"></nav><p class="note">每周一 09:00 同步公开 Stars。<br>分类参考仓库名称和简介，跨领域用途用标签补充。<br><br><a class="file-link" href="stars.md">查看 Markdown 文档 ↗</a></p></aside><main><div class="toolbar"><div class="search"><label for="search" hidden>搜索项目、简介与标签</label><input id="search" type="search" placeholder="搜索项目、简介与标签…"><button id="clear" aria-label="清空搜索" hidden>×</button></div><label for="sort" hidden>项目排序</label><select id="sort"><option value="recent">最近加星</option><option value="stars">Stars 数量</option><option value="name">项目名称</option></select></div><div class="section-top"><h2 id="section-name">全部项目</h2><span id="result-count" role="status" aria-live="polite"></span></div><div class="grid" id="projects"></div><section class="changes"><h2>更新记录</h2><div id="history"></div></section><p class="bottom">数据仅来自 Adrianchen916 的公开 Stars。网页为本地快照，打开时无需联网；仓库链接需要网络。Stars 数量与归档状态以最后同步为准。</p></main></div>
<script type="application/json" id="payload">__STARS_PAYLOAD__</script>
<script>
'use strict';
const {data,history}=JSON.parse(document.getElementById('payload').textContent);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const counts={};data.repositories.forEach(r=>counts[r.category]=(counts[r.category]||0)+1);
const last=history[history.length-1];const added=new Set(last&& !last.initial?last.added:[]);
let selected='全部项目';
$('total').textContent=data.repositories.length;
$('categories').textContent=Object.keys(counts).length;
$('sync-date').textContent=data.synced_at.slice(5,10).replace('-',' / ');
$('sync-date').title=data.synced_at+'（北京时间）';
const nav=['全部项目',...data.categories.filter(c=>counts[c])];
nav.forEach(c=>{const b=document.createElement('button');b.type='button';b.dataset.category=c;b.innerHTML=`<span>${esc(c)}</span><span class="n">${c==='全部项目'?data.repositories.length:counts[c]}</span>`;b.addEventListener('click',()=>{selected=c;render();});$('category-nav').append(b);});
function render(){
 const q=$('search').value.trim().toLowerCase();
 const rows=data.repositories.filter(r=>(selected==='全部项目'||r.category===selected)&&(!q||[r.name,r.description,r.category,r.language,...r.tags,...r.topics].filter(Boolean).join(' ').toLowerCase().includes(q)));
 const sort=$('sort').value;rows.sort(sort==='stars'?(a,b)=>b.stars-a.stars:sort==='name'?(a,b)=>a.name.localeCompare(b.name):(a,b)=>a.rank-b.rank);
 $('section-name').textContent=selected;$('result-count').textContent=`${rows.length} / ${data.repositories.length} 个项目`;$('clear').hidden=!q;
 document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.category===selected)));
 $('projects').innerHTML=rows.length?rows.map(r=>{const [owner,...parts]=r.name.split('/');const badges=[...(added.has(r.name)?['本次新增']:[]),...r.tags,...(r.description_source==='README 摘要'?['README 摘要']:[]),...(r.archived?['已归档']:[]),...(r.needs_review?['用途待核实']:[])];return `<article class="card"><div class="category">${esc(r.category)}</div><h3><a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer"><span class="owner">${esc(owner)} / </span>${esc(parts.join('/'))} ↗</a></h3><p class="desc">${esc(r.description||'仓库未提供简介；用途待核实。')}</p><div class="tags">${badges.map(t=>`<span class="tag ${t==='本次新增'?'new':''}">${esc(t)}</span>`).join('')}</div><footer><span>☆ ${r.stars.toLocaleString()}</span><span>${esc(r.language||'—')}</span>${r.pushed_at?`<span class="updated" title="仓库最后推送时间，不是加星时间">代码更新 ${esc(r.pushed_at.slice(0,10))}</span>`:''}</footer></article>`;}).join(''):'<div class="empty">没有找到匹配的项目。试试其他关键词或分类。</div>';
}
$('search').addEventListener('input',render);$('sort').addEventListener('change',render);$('clear').addEventListener('click',()=>{$('search').value='';render();$('search').focus();});
$('history').innerHTML=history.slice(-12).reverse().map(h=>`<details><summary>${esc(h.at)} · ${h.total} 个项目${h.initial?' · 首次建立快照':` · 新增 ${h.added.length} · 移出 ${h.removed.length}`}</summary><div class="change-list">${h.initial?'首次收录完整列表；不计为本周新增。':['added','removed'].map(k=>h[k].length?`<p>${k==='added'?'新增':'移出当前 Stars（仓库更名也可能表现为移出与新增）'}：${h[k].map(n=>`<a href="https://github.com/${esc(n)}" target="_blank" rel="noopener noreferrer">${esc(n)}</a>`).join('、')}</p>`:'').join('')}</div></details>`).join('');
render();
</script>
</body></html>
