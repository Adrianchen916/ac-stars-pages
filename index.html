<script>
'use strict';
const {data,history}=JSON.parse(document.getElementById('payload').textContent);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const counts={};data.repositories.forEach(r=>counts[r.category]=(counts[r.category]||0)+1);
const last=history[history.length-1];const added=new Set(last&& !last.initial?last.added:[]);
let selected='全部项目';
$('total').textContent=data.repositories.length;
$('categories').textContent=Object.keys(counts).length;
$('sync-date').textContent=data.synced_at.slice(5,10).replace('-',' / ');
$('sync-date').title=data.synced_at+'（北京时间）';
const nav=['全部项目',...data.categories.filter(c=>counts[c])];
nav.forEach(c=>{const b=document.createElement('button');b.type='button';b.dataset.category=c;b.innerHTML=`<span>${esc(c)}</span><span class="n">${c==='全部项目'?data.repositories.length:counts[c]}</span>`;b.addEventListener('click',()=>{selected=c;render();});$('category-nav').append(b);});
function render(){
 const q=$('search').value.trim().toLowerCase();
 const rows=data.repositories.filter(r=>(selected==='全部项目'||r.category===selected)&&(!q||[r.name,r.description,r.category,r.language,...r.tags,...r.topics].filter(Boolean).join(' ').toLowerCase().includes(q)));
 const sort=$('sort').value;rows.sort(sort==='stars'?(a,b)=>b.stars-a.stars:sort==='name'?(a,b)=>a.name.localeCompare(b.name):(a,b)=>a.rank-b.rank);
 $('section-name').textContent=selected;$('result-count').textContent=`${rows.length} / ${data.repositories.length} 个项目`;$('clear').hidden=!q;
 document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.category===selected)));
 $('projects').innerHTML=rows.length?rows.map(r=>{const [owner,...parts]=r.name.split('/');const badges=[...(added.has(r.name)?['本次新增']:[]),...r.tags,...(r.description_source==='README 摘要'?['README 摘要']:[]),...(r.archived?['已归档']:[]),...(r.needs_review?['用途待核实']:[])];return `<article class="card"><div class="category">${esc(r.category)}</div><h3><a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer"><span class="owner">${esc(owner)} / </span>${esc(parts.join('/'))} ↗</a></h3><p class="desc">${esc(r.description||'仓库未提供简介；用途待核实。')}</p><div class="tags">${badges.map(t=>`<span class="tag ${t==='本次新增'?'new':''}">${esc(t)}</span>`).join('')}</div><footer><span>☆ ${r.stars.toLocaleString()}</span><span>${esc(r.language||'—')}</span>${r.pushed_at?`<span class="updated" title="仓库最后推送时间，不是加星时间">代码更新 ${esc(r.pushed_at.slice(0,10))}</span>`:''}</footer></article>`;}).join(''):'<div class="empty">没有找到匹配的项目。试试其他关键词或分类。</div>';
}
$('search').addEventListener('input',render);$('sort').addEventListener('change',render);$('clear').addEventListener('click',()=>{$('search').value='';render();$('search').focus();});
$('history').innerHTML=history.slice(-12).reverse().map(h=>`<details><summary>${esc(h.at)} · ${h.total} 个项目${h.initial?' · 首次建立快照':` · 新增 ${h.added.length} · 移出 ${h.removed.length}`}</summary><div class="change-list">${h.initial?'首次收录完整列表；不计为本周新增。':['added','removed'].map(k=>h[k].length?`<p>${k==='added'?'新增':'移出当前 Stars（仓库更名也可能表现为移出与新增）'}：${h[k].map(n=>`<a href="https://github.com/${esc(n)}" target="_blank" rel="noopener noreferrer">${esc(n)}</a>`).join('、')}</p>`:'').join('')}</div></details>`).join('');
render();
</script>
